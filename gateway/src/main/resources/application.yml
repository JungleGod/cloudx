server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    import: optional:nacos:gateway.yaml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: reactive

  # Redis（限流）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  # 路由规则
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # ===== AI 对话（需要鉴权）=====
        - id: ai-agent-chat
          uri: lb://ai-agent
          predicates:
            - Path=/api/chat/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        # ===== 模型状态（公开）=====
        - id: ai-agent-models
          uri: lb://ai-agent
          predicates:
            - Path=/api/models

        # ===== 用户服务 — 公开接口 =====
        - id: biz-user-public
          uri: lb://biz-service
          predicates:
            - Path=/api/user/register,/api/user/login
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

        # ===== 用户服务 — 需鉴权接口 =====
        - id: biz-user-auth
          uri: lb://biz-service
          predicates:
            - Path=/api/user/**,/api/keys/**,/api/stats/**

        # ===== 内部接口（不对外暴露）=====
        - id: biz-internal
          uri: lb://biz-service
          predicates:
            - Path=/api/internal/**

  # Nacos 不再需要手动配置（在 bootstrap.yml 里）

# JWT 密钥（与 biz-service 一致）
jwt:
  secret: cloudx-ai-gateway-secret-key-2026-min-32bytes

# 鉴权白名单（无需 Token）
gateway:
  auth:
    white-list: /api/user/register,/api/user/login,/api/models,/health,/actuator/health,/api/internal/

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

# 日志
logging:
  level:
    com.cloudx: debug
    org.springframework.cloud.gateway: info
