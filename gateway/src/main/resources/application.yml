server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    import: optional:nacos:gateway.yaml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  main:
    web-application-type: reactive

  # Redis（限流）
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

  # 路由规则
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # ===== AI 对话（需要鉴权）=====
        - id: ai-agent-chat
          uri: lb://ai-agent
          predicates:
            - Path=/api/chat/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 10
                redis-rate-limiter.burstCapacity: 20
                redis-rate-limiter.requestedTokens: 1

        # ===== OpenAI 兼容 API（API Key 鉴权，由 ai-agent 自行处理）=====
        - id: openai-compatible
          uri: lb://ai-agent
          predicates:
            - Path=/v1/**
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 20
                redis-rate-limiter.burstCapacity: 40
                redis-rate-limiter.requestedTokens: 1

        # ===== 模型状态（公开）=====
        - id: ai-agent-models
          uri: lb://ai-agent
          predicates:
            - Path=/api/models

        # ===== 用户服务 — 公开接口 =====
        - id: biz-user-public
          uri: lb://biz-service
          predicates:
            - Path=/api/user/register,/api/user/login
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

        # ===== 用户服务 — 需鉴权接口 =====
        - id: biz-user-auth
          uri: lb://biz-service
          predicates:
            - Path=/api/user/**,/api/keys/**,/api/stats/**,/api/conversations/**

        # ===== Agent API =====
        - id: ai-agent-agents
          uri: lb://ai-agent
          predicates:
            - Path=/api/agents/**

        # ===== 管理员工具 API =====
        - id: ai-agent-admin-tools
          uri: lb://ai-agent
          predicates:
            - Path=/api/admin/tools/**

        # ===== 管理员接口（需鉴权）=====
        - id: biz-admin
          uri: lb://biz-service
          predicates:
            - Path=/api/admin/**

  # 内部接口 /api/internal/** 不在 gateway 路由——服务间调用由 ai-agent 直连 biz-service，公网不可达（2026-09-21 安全修复）

# JWT 密钥（与 biz-service 一致）
jwt:
  secret: cloudx-ai-gateway-secret-key-2026-min-32bytes

# 服务间内部 Token（AK/SK 验签需调 biz-service 内部接口取密钥，与 biz/ai-agent 保持一致）
cloudx:
  internal-token: ${INTERNAL_TOKEN:cloudx-internal-dev-2026}

# 鉴权白名单（无需 Token）
gateway:
  auth:
    white-list: /api/user/register,/api/user/login,/api/models,/health,/actuator/health,/v1/

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always

# 日志
logging:
  level:
    com.cloudx: debug
    org.springframework.cloud.gateway: info
