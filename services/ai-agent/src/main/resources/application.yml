server:
  port: 9090

spring:
  application:
    name: ai-agent
  config:
    import: optional:nacos:ai-agent.yaml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 日志
logging:
  level:
    com.cloudx: debug

# ========== cloudx 多模型配置 ==========
cloudx:
  models:
    - name: deepseek
      provider: openai-compatible
      base-url: https://api.deepseek.com
      model-name: deepseek-chat
      keys:
        - ${DEEPSEEK_API_KEY:}
        - ${DEEPSEEK_API_KEY_2:}
      tags: [code, general, chinese]
      priority: 1
      max-failures: 3
      fallback: qwen
      temperature: 0.7
      max-tokens: 2048
      timeout-seconds: 60

    - name: qwen
      provider: openai-compatible
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      model-name: qwen-turbo
      keys:
        - ${QWEN_API_KEY:}
      tags: [multimodal, general, chinese]
      priority: 2
      max-failures: 3
      fallback: deepseek
      temperature: 0.7
      max-tokens: 2048
      timeout-seconds: 60
