server:
  port: 9090

spring:
  application:
    name: ai-agent
  config:
    import: optional:nacos:ai-agent.yaml
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# 日志
logging:
  level:
    com.cloudx: debug

